{% extends 'base.html' %}
{% block title %}Contraseña Restablecida - Korva Nicaragua{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full korva-card rounded-lg p-8 border border-korva-dark-alt text-center">
        <div class="w-16 h-16 mx-auto bg-green-500 rounded-full flex items-center justify-center mb-4">
            <i class="fas fa-check-circle text-white text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-white mb-4">Contraseña Restablecida</h2>
        <p class="text-gray-400 mb-6">
            Tu contraseña ha sido cambiada exitosamente.
            Ahora puedes iniciar sesión con tu nueva contraseña.
        </p>
        <a href="{% url 'login' %}" class="korva-btn-primary inline-block px-6 py-3 rounded-lg font-semibold">
            <i class="fas fa-sign-in-alt mr-2"></i> Iniciar Sesión
        </a>
    </div>
</div>
{% endblock %}
