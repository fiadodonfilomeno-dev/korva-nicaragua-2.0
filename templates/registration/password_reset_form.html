{% extends 'base.html' %}
{% block title %}Recuperar Contraseña - Korva Nicaragua{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-korva-card rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-korva-success rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-key text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Recuperar Contraseña</h1>
            <p class="text-gray-400 text-sm mt-1">Ingresa tu correo y te enviaremos instrucciones</p>
        </div>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Correo electrónico</label>
                <input type="email" name="email" required class="w-full px-4 py-2.5 bg-korva-dark border border-korva-dark-alt rounded-lg text-white focus:outline-none focus:border-korva-success transition">
            </div>
            <button type="submit" class="w-full korva-btn-primary py-2.5 rounded-lg font-medium">Enviar instrucciones</button>
        </form>
        <p class="text-center text-gray-500 text-sm mt-4">
            <a href="{% url 'login' %}" class="text-korva-success hover:underline">Volver a iniciar sesión</a>
        </p>
    </div>
</div>
{% endblock %}
