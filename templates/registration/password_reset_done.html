{% extends 'base.html' %}
{% block title %}Correo Enviado - Korva Nicaragua{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-korva-card rounded-2xl shadow-xl p-8 text-center">
        <div class="w-16 h-16 bg-korva-success rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-envelope text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Correo Enviado</h1>
        <p class="text-gray-400">Revisa tu bandeja de entrada. Si el correo está registrado, recibirás instrucciones para recuperar tu contraseña.</p>
        <p class="text-gray-500 text-sm mt-4">
            <a href="{% url 'login' %}" class="text-korva-success hover:underline">Volver a iniciar sesión</a>
        </p>
    </div>
</div>
{% endblock %}
