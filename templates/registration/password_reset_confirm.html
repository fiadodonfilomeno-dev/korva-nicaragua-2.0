{% extends 'base.html' %}
{% block title %}Nueva Contraseña - Korva Nicaragua{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-korva-card rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-korva-success rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-lock text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Nueva Contraseña</h1>
        </div>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Nueva contraseña</label>
                <input type="password" name="new_password1" required class="w-full px-4 py-2.5 bg-korva-dark border border-korva-dark-alt rounded-lg text-white focus:outline-none focus:border-korva-success transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Confirmar contraseña</label>
                <input type="password" name="new_password2" required class="w-full px-4 py-2.5 bg-korva-dark border border-korva-dark-alt rounded-lg text-white focus:outline-none focus:border-korva-success transition">
            </div>
            <button type="submit" class="w-full korva-btn-primary py-2.5 rounded-lg font-medium">Cambiar contraseña</button>
        </form>
    </div>
</div>
{% endblock %}
