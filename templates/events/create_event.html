{% extends 'base.html' %}

{% block title %}Crear Evento - Korva Nicaragua{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-white mb-8"><i class="fas fa-calendar-plus text-korva-success"></i> Crear Evento</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-gray-400 text-sm mb-2">Titulo *</label>
            <input type="text" name="title" required class="korva-input w-full" placeholder="Nombre del evento">
        </div>
        <div>
            <label class="block text-gray-400 text-sm mb-2">Descripcion *</label>
            <textarea name="description" required rows="5" class="korva-input w-full" placeholder="Describe el evento..."></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-400 text-sm mb-2">Categoria</label>
                <select name="category" class="korva-input w-full">
                    {% for value, label in categories %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-2">Ciudad</label>
                <select name="city" class="korva-input w-full">
                    {% for value, label in cities %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-400 text-sm mb-2">Fecha *</label>
                <input type="date" name="date" required class="korva-input w-full">
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-2">Hora</label>
                <input type="time" name="time" class="korva-input w-full">
            </div>
        </div>
        <div>
            <label class="block text-gray-400 text-sm mb-2">Lugar</label>
            <input type="text" name="location" class="korva-input w-full" placeholder="Direccion del evento">
        </div>
        <div>
            <label class="block text-gray-400 text-sm mb-2">Maximo de asistentes</label>
            <input type="number" name="max_attendees" class="korva-input w-full" placeholder="Dejar vacio para ilimitado" min="1">
        </div>
        <div>
            <label class="block text-gray-400 text-sm mb-2">Imagen del evento</label>
            <input type="file" name="image" accept="image/*" class="block w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-korva-success file:text-white">
        </div>
        <button type="submit" class="korva-btn-primary px-8 py-3 rounded-lg font-semibold w-full">
            <i class="fas fa-calendar-check mr-2"></i> Crear Evento
        </button>
    </form>
</div>
{% endblock %}
