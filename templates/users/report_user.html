{% extends 'base.html' %}
{% block title %}Reportar Usuario - Korva Nicaragua{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-korva-card rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-flag text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Reportar Usuario</h1>
            <p class="text-gray-400 text-sm mt-1">Reportar a <strong>{{ reported.profile.business_name|default:reported.username }}</strong></p>
        </div>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Motivo</label>
                <select name="reason" required class="w-full px-4 py-2.5 bg-korva-dark border border-korva-dark-alt rounded-lg text-white focus:outline-none focus:border-korva-success transition">
                    <option value="spam">Spam</option>
                    <option value="harassment">Acoso</option>
                    <option value="fake">Información falsa</option>
                    <option value="inappropriate">Contenido inapropiado</option>
                    <option value="scam">Estafa</option>
                    <option value="other">Otro</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Descripción (opcional)</label>
                <textarea name="description" rows="4" class="w-full px-4 py-2.5 bg-korva-dark border border-korva-dark-alt rounded-lg text-white focus:outline-none focus:border-korva-success transition" placeholder="Cuéntanos más detalles..."></textarea>
            </div>
            <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-lg font-medium transition">Enviar Reporte</button>
        </form>
    </div>
</div>
{% endblock %}
