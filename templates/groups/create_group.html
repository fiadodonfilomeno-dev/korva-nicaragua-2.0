{% extends 'base.html' %}

{% block title %}Crear Grupo - Korva Nicaragua{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-white mb-8"><i class="fas fa-users text-korva-success"></i> Crear Grupo</h1>

    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-gray-400 text-sm mb-2">Nombre del grupo *</label>
            <input type="text" name="name" required class="korva-input w-full" placeholder="Ej: Artesanos de Masaya">
        </div>
        <div>
            <label class="block text-gray-400 text-sm mb-2">Descripcion *</label>
            <textarea name="description" required rows="4" class="korva-input w-full" placeholder="Describe el proposito del grupo..."></textarea>
        </div>
        <div>
            <label class="block text-gray-400 text-sm mb-2">Sector</label>
            <select name="sector" class="korva-input w-full">
                {% for value, label in sectors %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-gray-400 text-sm mb-2">Imagen del grupo</label>
            <input type="file" name="image" accept="image/*" class="block w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-korva-success file:text-white">
        </div>
        <button type="submit" class="korva-btn-primary px-8 py-3 rounded-lg font-semibold w-full">
            <i class="fas fa-users mr-2"></i> Crear Grupo
        </button>
    </form>
</div>
{% endblock %}
