databases:
  - name: korva-nicaragua-db
    plan: free
    region: virginia

services:
  - type: web
    name: korva-nicaragua
    env: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed && python manage.py ensure_admin
    startCommand: python manage.py ensure_admin && gunicorn korva_config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: korva-nicaragua-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://korva-nicaragua.onrender.com"
      - key: FRONTEND_URL
        value: "https://korva-nicaragua.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: DEFAULT_FROM_EMAIL
        value: "Korva Nicaragua <noreply@korva.ni>"
      - key: USE_REDIS
        value: "False"
